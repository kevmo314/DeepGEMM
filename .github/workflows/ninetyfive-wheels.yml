# Builds the DeepGEMM wheels ninetyfive installs (free-threaded CPython 3.14t,
# torch 2.10 + CUDA 13.0) for x86_64 and aarch64, and attaches them to the
# release. DeepGEMM JIT-compiles its kernels at runtime; the wheel only carries
# the C++ extension (tied to TORCH_VERSION) and the kernel headers, plus
# ninetyfive's W8A8 kernels precompiled (no GPU needed) as a read-only cache.

name: Build ninetyfive wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14t"
  TORCH_VERSION: "2.10.0"
  TORCH_INDEX: "https://download.pytorch.org/whl/cu130"
  CUDA_VERSION: "13.0.1"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # The nvcc ninetyfive JIT-compiles with (its pyproject pins), part of every cache key.
  NVCC_WHEELS: "nvidia-cuda-nvcc==13.0.88 nvidia-nvvm==13.0.88 nvidia-cuda-cccl==13.0.85"
  # (N, K) of the FP8 projections of the models ninetyfive serves, after fusion:
  # Qwen3.8-27B-FP8's qkv, in_proj_qkvz, o_proj/out_proj, gate_up_proj, down_proj.
  PRECOMPILE_SHAPES: "[[14336, 5120], [16384, 5120], [5120, 6144], [34816, 5120], [5120, 17408]]"
  # H100 SXM, H200 and GH200; H100 PCIe.
  PRECOMPILE_NUM_SMS: "[132, 114]"

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  build:
    name: deep-gemm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for an older glibc baseline, as ninetyfive's flash-attention wheels.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          df -h /

      - name: Install GCC 13 and libdw
        # DeepGEMM needs C++20 <format> (GCC 13) and elfutils' libdwfl headers.
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13 libdw-dev
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          linux-local-args: '["--toolkit"]'
          sub-packages: '["nvcc", "cudart", "cccl"]'

      - name: Install CUDA library headers
        # torch's ATen/cuda/CUDAContext.h includes the cuBLAS, cuSPARSE and
        # cuSOLVER headers (from the CUDA apt repository the step above added).
        run: |
          v="${CUDA_VERSION%.*}"; v="${v/./-}"
          sudo apt-get install -y --no-install-recommends \
            "libcublas-dev-${v}" "libcusparse-dev-${v}" "libcusolver-dev-${v}" "libcurand-dev-${v}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "torch==${TORCH_VERSION}" --index-url "${TORCH_INDEX}"
          python -m pip install setuptools ninja packaging wheel
          python -c "import sys, torch; print(sys.version, torch.__version__, torch.version.cuda)"
          nvcc --version
          g++-13 --version

      - name: Build the extension
        run: |
          # Build here instead of fetching an upstream wheel (there are no cp314t ones).
          # Tag the version itself so the wheel name and METADATA agree.
          local_tag="cu130torch${TORCH_VERSION%.*}"
          sed -i -E "s/^(__version__ = '[^'+]+)'/\1+${local_tag}'/" deep_gemm/__init__.py
          grep '^__version__' deep_gemm/__init__.py
          echo "DG_FORCE_BUILD=1" >> "$GITHUB_ENV"
          echo "DG_USE_LOCAL_VERSION=0" >> "$GITHUB_ENV"
          echo "LDSHARED=g++-13 -shared" >> "$GITHUB_ENV"
          DG_FORCE_BUILD=1 DG_USE_LOCAL_VERSION=0 LDSHARED="g++-13 -shared" \
            python setup.py bdist_wheel --dist-dir=build/stage1
          python -m pip install --no-deps build/stage1/*.whl

      - name: Precompile kernels
        # With the built extension (the cache keys hash its kernel headers) and the
        # nvcc ninetyfive runs; every prefill row count ninetyfive gives DeepGEMM:
        # multiples of 128 up to 8192.
        run: |
          python -m pip install ${NVCC_WHEELS}
          export CUDA_HOME="$(python -c 'import importlib.metadata as m, pathlib; print(next(pathlib.Path(f.locate()).parent.parent for f in m.files("nvidia-cuda-nvcc") if f.name == "nvcc"))')"
          export DG_JIT_CACHE_DIR="${PWD}/precompiled"
          "${CUDA_HOME}/bin/nvcc" --version
          cd /tmp && python - <<'PY'
          import json, os, time
          import deep_gemm
          shapes = json.loads(os.environ["PRECOMPILE_SHAPES"])
          num_sms = json.loads(os.environ["PRECOMPILE_NUM_SMS"])
          start, kernels = time.monotonic(), set()
          for sms in num_sms:
              for n, k in shapes:
                  for m in range(128, 8193, 128):
                      kernels.add(deep_gemm.precompile_fp8_gemm_nt(m, n, k, sms))
          print(f"{len(kernels)} kernels in {time.monotonic() - start:.0f}s")
          PY
          cd - && rm -rf precompiled/tmp && du -sh precompiled

      - name: Build wheel
        run: |
          python setup.py bdist_wheel --dist-dir=dist
          ls -la dist

      - name: Check the wheel
        # Imports, and finds its precompiled kernels from an empty writable cache.
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          export CUDA_HOME="$(python -c 'import importlib.metadata as m, pathlib; print(next(pathlib.Path(f.locate()).parent.parent for f in m.files("nvidia-cuda-nvcc") if f.name == "nvcc"))')"
          export DG_JIT_CACHE_DIR="$(mktemp -d)"
          cd /tmp && python - <<'PY'
          import os, deep_gemm
          print(deep_gemm.__version__, os.environ["DG_JIT_CACHE_DIR"])
          path = deep_gemm.precompile_fp8_gemm_nt(256, 5120, 6144, 132)
          assert path.startswith(os.path.dirname(deep_gemm.__file__)), path
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-gemm-${{ matrix.os }}
          path: dist/*.whl

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        # uploads.github.com intermittently answers HTTP 500; retry.
        run: |
          for attempt in 1 2 3 4 5; do
            gh release upload "${RELEASE_TAG}" dist/*.whl --clobber --repo "${GITHUB_REPOSITORY}" && exit 0
            sleep $((attempt * 15))
          done
          exit 1
